name: Deploy FeedMe to Google Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gcp-main
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
  AR_REPO: feedme
  BACKEND_SERVICE: feedme-backend
  FRONTEND_SERVICE: feedme-frontend
  RUNTIME_SERVICE_ACCOUNT: feedme-runtime
  FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
  API_URL: ${{ vars.API_URL }}

jobs:
  ci:
    name: Validate before deploying
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build and deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      id-token: write

    env:
      BACKEND_IMAGE: ${{ vars.GCP_REGION || 'europe-west1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/feedme/feedme-backend
      FRONTEND_IMAGE: ${{ vars.GCP_REGION || 'europe-west1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/feedme/feedme-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy "$BACKEND_SERVICE" \
            --image="$BACKEND_IMAGE:${GITHUB_SHA}" \
            --region="$REGION" \
            --platform=managed \
            --port=8000 \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --set-env-vars="APP_ENV=production,MONGO_DATABASE=feedme,FRONTEND_ORIGIN=${FRONTEND_ORIGIN},GEMINI_MODEL=gemini-2.5-flash,GEMINI_WEB_SEARCH_ENABLED=false,OSM_USER_AGENT=FeedMe/1.0,OVERPASS_TIMEOUT_SECONDS=30" \
            --set-secrets="MONGO_URL=feedme-mongo-url:latest,JWT_SECRET=feedme-jwt-secret:latest,GEMINI_API_KEY=feedme-gemini-api-key:latest"

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./feedme-app
          file: ./feedme-app/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_URL }}
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy "$FRONTEND_SERVICE" \
            --image="$FRONTEND_IMAGE:${GITHUB_SHA}" \
            --region="$REGION" \
            --platform=managed \
            --port=3000 \
            --allow-unauthenticated
