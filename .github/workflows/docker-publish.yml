name: Publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/feedme-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/feedme-frontend

jobs:
  ci:
    name: Validate before publishing
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }},${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend-publish
          cache-to: type=gha,mode=max,scope=backend-publish

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./feedme-app
          file: ./feedme-app/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }},${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend-publish
          cache-to: type=gha,mode=max,scope=frontend-publish
